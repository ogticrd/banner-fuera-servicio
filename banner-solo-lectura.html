<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviso de solo lectura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    /* Paleta tomada de gob.do */
    :root {
      --gob-azul-oscuro: #003876;
      --gob-azul: #006FD2;
      --gob-azul-claro: #EBF7FF;
      --gob-ambar: #FFBA00;
      --gob-texto: #4D646D;
      --gob-blanco: #FFFFFF;
    }

    body {
      margin: 0;
      background: var(--gob-blanco);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .banner-institucional {
      box-sizing: border-box;
      width: 100%;
      background: var(--gob-azul-oscuro);
      color: var(--gob-blanco);
      border-bottom: 4px solid var(--gob-ambar);
    }

    .banner-institucional__inner {
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
    }

    .banner-institucional__icono {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background: var(--gob-ambar);
      color: var(--gob-azul-oscuro);
    }

    .banner-institucional__icono svg {
      width: 22px;
      height: 22px;
    }

    .banner-institucional__contenido {
      flex: 1;
      min-width: 0;
    }

    .banner-institucional__etiqueta {
      display: inline-block;
      margin-bottom: 4px;
      padding: 2px 10px;
      border-radius: 9999px;
      background: var(--gob-azul);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .banner-institucional__titulo {
      margin: 0 0 2px;
      font-family: Poppins, sans-serif;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.35;
    }

    .banner-institucional__mensaje {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gob-azul-claro);
    }

    @media (max-width: 600px) {
      .banner-institucional__inner {
        align-items: flex-start;
        gap: 12px;
        padding: 12px 16px;
      }

      .banner-institucional__icono {
        width: 34px;
        height: 34px;
      }

      .banner-institucional__icono svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="banner-institucional" role="alert" aria-live="polite">
    <div class="banner-institucional__inner">
      <div class="banner-institucional__icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/>
          <line x1="12" y1="8" x2="12" y2="13"/>
          <circle cx="12" cy="16.5" r="0.6" fill="currentColor"/>
        </svg>
      </div>
      <div class="banner-institucional__contenido">
        <span class="banner-institucional__etiqueta">Aviso importante</span>
        <p class="banner-institucional__titulo">Plataforma en modo de solo lectura</p>
        <p class="banner-institucional__mensaje">
          Temporalmente en modo de solo lectura mientras esperamos una actualización de seguridad urgente.
          Agradecemos su comprensión.
        </p>
      </div>
    </div>
  </div>

</body>
</html>
